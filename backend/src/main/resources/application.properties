spring.application.name=studymate-api
spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/studymate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:studymate}
spring.datasource.password=${DB_PASSWORD:studymate_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deploying-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.model=${OLLAMA_MODEL:llama3.2:1b}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}